# server.port=${PORT:0}
server.port=8003
spring.mail.port=587
#Variabless de entonrno del servicio
service.validation-code-duration=20
service.two-factores-validation-code-duration=30
service.phone-sms-permited=true
service.whatsapp-permited=true
service.url-agregar-password=http://localhost:8080/agregar-password/username/codigo

#Configuracion para la base de datos
spring.datasource.url= jdbc:mysql://mysql8:3306/econsulta_db?allowPublicKeyRetrieval=true&useSSL=false&useTimezone=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=sasa
spring.datasource.drive-class-name=com.mysql.jdbc.Driver
spring.jpa.show-sql:true
spring.jpa.hibernate.ddl-auto:update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Configuración de HikariCP
spring.datasource.hikari.connection-timeout=60000  # Espera máxima de 60 segundos para conexión
spring.datasource.hikari.maximum-pool-size=10  # Hasta 10 conexiones simultáneas
spring.datasource.hikari.minimum-idle=2  # Número mínimo de conexiones inactivas
spring.datasource.hikari.idle-timeout=300000  # Tiempo máximo de inactividad antes de cerrar conexiones (300 segundos)
spring.datasource.hikari.initialization-fail-timeout=-1  # Espera indefinida para conexión inicial

#Configuracion de docker secrets para las credenciales de la api de gmail
gmail.client.id=${file:/run/secrets/GMAIL_CLIENT_ID}
gmail.client.secret=${file:/run/secrets/GMAIL_CLIENT_SECRET}
gmail.refresh.token=${file:/run/secrets/GMAIL_REFRESH_TOKEN}
gmail.email=team.code.dev25@gmail.com

#Documentation
springdoc.api-docs.enabled = true
springdoc.swagger-ui.enabled = true
 #swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
